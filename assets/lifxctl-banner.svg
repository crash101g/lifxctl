<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="lifxctl: LIFX lights from the command line">
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="0.35" stop-color="#ffb02e"/>
      <stop offset="0.65" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#3d8bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151822"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
  </defs>

  <rect width="720" height="200" rx="20" fill="url(#bg)"/>

  <!-- icon: glowing light strip behind a screen with a terminal prompt -->
  <g transform="translate(40 30)">
    <rect x="6" y="18" width="128" height="88" rx="12" fill="url(#strip)" filter="url(#glow)" opacity="0.95"/>
    <rect x="10" y="22" width="120" height="80" rx="10" fill="none" stroke="url(#strip)" stroke-width="3" opacity="0.9"/>
    <rect x="18" y="30" width="104" height="64" rx="7" fill="#0b0d12" stroke="#2a2f3d" stroke-width="2"/>
    <path d="M36 52 l14 10 -14 10" fill="none" stroke="#e8ecf4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="68" width="24" height="5" rx="2.5" fill="#3ddc97"/>
    <rect x="56" y="106" width="28" height="10" rx="3" fill="#2a2f3d"/>
    <rect x="44" y="114" width="52" height="6" rx="3" fill="#2a2f3d"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="98" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="62" font-weight="700" fill="#e8ecf4">lifx<tspan fill="url(#strip)">ctl</tspan></text>
  <text x="212" y="136" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#9aa3b5">find · control · watch · diagnose your smart lights</text>
  <rect x="212" y="152" width="300" height="4" rx="2" fill="url(#strip)" opacity="0.85"/>
</svg>
